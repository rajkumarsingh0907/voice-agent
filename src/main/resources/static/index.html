<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 620px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .record-section {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #recordButton {
            background: #111827;
            color: white;
        }

        #recordButton.recording {
            background: #dc2626;
        }

        .status {
            margin-top: 15px;
            color: #666;
            min-height: 24px;
        }

        .message-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
        }

        .label {
            font-size: 13px;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .message {
            font-size: 17px;
            line-height: 1.5;
            min-height: 30px;
        }

        .hidden {
            display: none;
        }

        .playing {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎙️ Voice AI Assistant</h1>

    <div class="subtitle">
        Ask about your order status
    </div>

    <div class="record-section">

        <button id="recordButton">
            🎤 Start Recording
        </button>

        <div id="status" class="status">
            Click the button and start speaking
        </div>

    </div>

    <div class="message-box">
        <div class="label">YOU SAID</div>

        <div id="transcript" class="message">
            -
        </div>
    </div>

    <div class="message-box">
        <div class="label">ASSISTANT</div>

        <div id="response" class="message">
            -
        </div>
    </div>

    <div id="playing" class="playing hidden">
        🔊 Playing response...
    </div>

</div>


<script>

    const recordButton = document.getElementById("recordButton");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const response = document.getElementById("response");
    const playing = document.getElementById("playing");

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;


    recordButton.addEventListener("click", async () => {

        if (!isRecording) {

            await startRecording();

        } else {

            stopRecording();

        }

    });


    async function startRecording() {

        try {

            const stream = await navigator.mediaDevices.getUserMedia({
                audio: true
            });

            mediaRecorder = new MediaRecorder(stream);

            audioChunks = [];

            mediaRecorder.ondataavailable = event => {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }

            };


            mediaRecorder.onstop = async () => {

                const audioBlob = new Blob(
                    audioChunks,
                    {
                        type: mediaRecorder.mimeType || "audio/webm"
                    }
                );

                stream.getTracks().forEach(track => track.stop());

                await sendAudio(audioBlob);

            };


            mediaRecorder.start();

            isRecording = true;

            recordButton.innerText = "⏹ Stop Recording";
            recordButton.classList.add("recording");

            status.innerText = "Listening...";

            transcript.innerText = "-";
            response.innerText = "-";

        } catch (error) {

            console.error(error);

            status.innerText =
                "Unable to access microphone.";

        }

    }


    function stopRecording() {

        mediaRecorder.stop();

        isRecording = false;

        recordButton.innerText = "🎤 Start Recording";
        recordButton.classList.remove("recording");

        status.innerText = "Processing your request...";

    }


    async function sendAudio(audioBlob) {

        try {

            const formData = new FormData();

            formData.append(
                "audio",
                audioBlob,
                "recording.webm"
            );


            const apiResponse = await fetch(
                "/api/voice/chat",
                {
                    method: "POST",
                    body: formData
                }
            );


            if (!apiResponse.ok) {

                throw new Error(
                    "Request failed: " + apiResponse.status
                );

            }


            const result = await apiResponse.json();


            transcript.innerText =
                result.transcript;


            response.innerText =
                result.response;


            status.innerText =
                "Response received";


            playAudio(result.audioBase64);


        } catch (error) {

            console.error(error);

            status.innerText =
                "Something went wrong while processing the request.";

        }

    }


    function playAudio(base64Audio) {

        if (!base64Audio) {
            return;
        }


        const audio = new Audio(
            "data:audio/mpeg;base64," + base64Audio
        );


        playing.classList.remove("hidden");


        audio.play();


        audio.onended = () => {

            playing.classList.add("hidden");

        };

    }

</script>

</body>
</html>
